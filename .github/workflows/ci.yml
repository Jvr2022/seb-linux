name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  build-qtwebengine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt WebEngine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libqt6svg6-dev \
            qt6-base-dev \
            qt6-tools-dev-tools \
            qt6-webengine-dev \
            zlib1g-dev

      - name: Build Qt WebEngine backend
        run: ./scripts/build.sh CONFIG+=force_qtwebengine

      - name: Upload Qt WebEngine binary
        uses: actions/upload-artifact@v7
        with:
          name: safe-exam-browser-qtwebengine
          path: build/bin/safe-exam-browser
          if-no-files-found: error

  build-webkitgtk-fallback:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install WebKitGTK fallback build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libqt6svg6-dev \
            qt6-base-dev \
            qt6-tools-dev-tools \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            zlib1g-dev

      - name: Build WebKitGTK fallback backend
        run: ./scripts/build.sh CONFIG+=force_webkitgtk

      - name: Upload WebKitGTK binary
        uses: actions/upload-artifact@v7
        with:
          name: safe-exam-browser-webkitgtk
          path: build/bin/safe-exam-browser
          if-no-files-found: error

  runtime-smoke:
    needs:
      - build-qtwebengine
      - build-webkitgtk-fallback
    runs-on: ubuntu-24.04
    steps:
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libqt6webenginewidgets6 \
            libqt6webenginecore6-bin \
            libqt6webengine6-data \
            libqt6xml6t64 \
            qt6-qpa-plugins \
            libwebkit2gtk-4.1-0 \
            libgtk-3-0t64 \
            zlib1g

      - name: Download Qt WebEngine binary
        uses: actions/download-artifact@v8
        with:
          name: safe-exam-browser-qtwebengine
          path: artifacts/qtwebengine

      - name: Download WebKitGTK binary
        uses: actions/download-artifact@v8
        with:
          name: safe-exam-browser-webkitgtk
          path: artifacts/webkitgtk

      - name: Verify Qt WebEngine runtime
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x artifacts/qtwebengine/safe-exam-browser
          ldd artifacts/qtwebengine/safe-exam-browser | grep -q 'libQt6WebEngine'
          ! ldd artifacts/qtwebengine/safe-exam-browser | grep -q 'libwebkit2gtk-4.1'
          artifacts/qtwebengine/safe-exam-browser --version

      - name: Verify WebKitGTK runtime
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x artifacts/webkitgtk/safe-exam-browser
          ldd artifacts/webkitgtk/safe-exam-browser | grep -q 'libwebkit2gtk-4.1'
          ! ldd artifacts/webkitgtk/safe-exam-browser | grep -q 'libQt6WebEngine'
          artifacts/webkitgtk/safe-exam-browser --version

  # Portable AppImages are built on Ubuntu 22.04 (glibc 2.35) for Ubuntu 22.04+ / Fedora 39+.
  # Full AppImage packaging is heavy; run on main/master pushes (not every PR).
  build-appimage:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Bootstrap container packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates \
            git \
            wget \
            sudo \
            binutils

      - uses: actions/checkout@v7

      - name: Build AppImage artifacts
        run: |
          chmod +x scripts/build-release.sh
          scripts/build-release.sh "0.0.0-ci"

      - name: Upload AppImage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: safe-exam-browser-appimage
          path: |
            dist/*.AppImage
          if-no-files-found: error

  appimage-smoke-ubuntu:
    needs:
      - build-appimage
    runs-on: ubuntu-24.04
    steps:
      - name: Install AppImage host runtime libs
        run: |
          # libEGL/GL stay on the host (not bundled). Fonts/GTK bits help the WebKit AppImage.
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libgles2 \
            libfreetype6 \
            fontconfig \
            libxkbcommon0 \
            libgtk-3-0t64 \
            libwebkit2gtk-4.1-0

      - name: Download AppImage artifacts
        uses: actions/download-artifact@v8
        with:
          name: safe-exam-browser-appimage
          path: dist

      - name: Smoke-test AppImages on Ubuntu
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x dist/*.AppImage
          for appimage in dist/*.AppImage; do
            echo "Running ${appimage} --version"
            "${appimage}" --version
          done

  appimage-smoke-fedora:
    needs:
      - build-appimage
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install AppImage host runtime libs
        run: |
          dnf install -y \
            libglvnd-egl \
            mesa-libEGL \
            mesa-libGL \
            freetype \
            fontconfig \
            libxkbcommon \
            gtk3 \
            webkit2gtk4.1

      - name: Download AppImage artifacts
        uses: actions/download-artifact@v8
        with:
          name: safe-exam-browser-appimage
          path: dist

      - name: Smoke-test AppImages on Fedora
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x dist/*.AppImage
          for appimage in dist/*.AppImage; do
            echo "Running ${appimage} --version"
            "${appimage}" --version
          done
